name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  build-windows:
    name: Build Windows (${{ matrix.arch }})
    needs: test
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            goarch: amd64
            output: infisical-ksp.dll
            ldflags: "-s -w"
          - arch: x86
            goarch: "386"
            output: infisical-ksp-x86.dll
            ldflags: "-s -w -extldflags=-Wl,--kill-at"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install the Cryptographic Provider Development Kit
        shell: pwsh
        run: |
          $url = "https://download.microsoft.com/download/1/7/6/176909b0-50f2-4df3-b29b-830a17ea7e38/CPDK_RELEASE_UPDATE/cpdksetup.exe"
          Invoke-WebRequest -UseBasicParsing $url -OutFile cpdksetup.exe
          Start-Process .\cpdksetup.exe -ArgumentList '/quiet','/norestart' -Wait
          $hdr = Get-ChildItem "C:\Program Files (x86)\Windows Kits","C:\Program Files\Windows Kits" -Recurse -Filter ncrypt_provider.h -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $hdr) { throw "ncrypt_provider.h not found after installing the CPDK" }
          # The Go tool splits CGO_CFLAGS on spaces, so the include path must be space-free. The CPDK
          # installs under "Program Files (x86)"; copy its Include dir to a space-free location.
          New-Item -ItemType Directory -Force -Path C:\cpdk | Out-Null
          Copy-Item (Join-Path (Split-Path $hdr.FullName) '*') C:\cpdk -Recurse -Force
          "CGO_CFLAGS=-IC:\cpdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      - name: Install 32-bit MinGW toolchain (x86 only)
        if: matrix.arch == 'x86'
        shell: pwsh
        run: |
          # The x86_64 MinGW on the runner cannot target 32-bit, so pull the i686 toolchain from MSYS2.
          C:\msys64\usr\bin\pacman.exe -Sy --noconfirm
          C:\msys64\usr\bin\pacman.exe -S --needed --noconfirm mingw-w64-i686-gcc
          $cc = "C:\msys64\mingw32\bin\gcc.exe"
          if (-not (Test-Path $cc)) { throw "i686 gcc not found at $cc after install" }
          & $cc --version
          "CC=$cc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          "C:\msys64\mingw32\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding ascii

      - name: Build
        shell: pwsh
        env:
          CGO_ENABLED: "1"
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -buildmode=c-shared -ldflags="${{ matrix.ldflags }}" -o ${{ matrix.output }} .\cmd\ksp
          if (-not (Test-Path ${{ matrix.output }})) { throw "build produced no ${{ matrix.output }}" }
          # CNG resolves the provider by the undecorated export name. Confirm it is present and that
          # the 32-bit build did not leave the stdcall @nn decoration on it (dumpbin is an MSVC tool).
          $dumpbin = Get-Command dumpbin.exe -ErrorAction SilentlyContinue
          if ($dumpbin) {
            $exports = & dumpbin.exe /exports ${{ matrix.output }}
            if (-not ($exports | Select-String "GetKeyStorageInterface")) { throw "GetKeyStorageInterface export missing" }
            if ($exports | Select-String "GetKeyStorageInterface@") { throw "GetKeyStorageInterface is name-decorated (@nn); CNG will not resolve it" }
            $exports | Select-String GetKeyStorageInterface
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}

  release:
    name: Create Release
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir release
          find artifacts -type f \( -name 'infisical-ksp.dll' -o -name 'infisical-ksp-x86.dll' \) -exec mv {} release/ \;
          ls -la release/

      - name: Generate checksums
        working-directory: release
        run: |
          sha256sum infisical-ksp.dll infisical-ksp-x86.dll > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*
